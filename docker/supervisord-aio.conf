[program:cypht-gateway]
command=/usr/local/bin/gatewayd
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=GATEWAY_MASTER_KEY="%(ENV_GATEWAY_MASTER_KEY)s",CYPHT_BASE_URL="%(ENV_CYPHT_BASE_URL)s",CYPHT_API_LOGIN_KEY="%(ENV_CYPHT_API_LOGIN_KEY)s",CYPHT_BRIDGE_KEY="%(ENV_CYPHT_BRIDGE_KEY)s",GATEWAY_BIND="%(ENV_GATEWAY_BIND)s",GATEWAY_DB_PATH="%(ENV_GATEWAY_DB_PATH)s",RUST_LOG="gatewayd=info"

[program:cypht-mcp]
command=/usr/local/bin/cypht-mcp --transport http --bind 0.0.0.0:8790 --url http://127.0.0.1:18080 --allowed-host localhost --allowed-host 127.0.0.1
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=CYPHT_GATEWAY_URL="http://127.0.0.1:18080",RUST_LOG="cypht_mcp=info"