user www-data;
worker_processes 4;
pid /run/nginx.pid;
events {
    worker_connections 768;
}
http {
    sendfile off;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers on;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    gzip on;
    gzip_disable "msie6";

    server {
        listen 80;
        server_name localhost;
        index index.php;
        root /var/www;
        client_max_body_size 60M;

        # Block public external access to private PHP bridge endpoints
        if ($arg_page ~* "^ajax_gateway_") {
            return 403;
        }

        # Gateway REST API v1
        location /api/v1/ {
            proxy_pass http://127.0.0.1:18080/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Gateway Health Check
        location = /healthz {
            proxy_pass http://127.0.0.1:18080/healthz;
        }

        # Embedded Gateway Console UI
        location = /gateway {
            return 302 /gateway/;
        }
        location /gateway/ {
            proxy_pass http://127.0.0.1:18080/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        # MCP Streamable HTTP Endpoint
        location /mcp {
            proxy_pass http://127.0.0.1:8790/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:8790;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }
        location ~ \.php {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_index index.php;
            fastcgi_pass 127.0.0.1:9000;
        }
    }

    # Internal loopback listener exclusively for gatewayd -> Cypht PHP bridge
    server {
        listen 127.0.0.1:8089;
        server_name localhost;
        index index.php;
        root /var/www;
        client_max_body_size 60M;
        location / {
            try_files $uri /index.php$is_args$args;
        }
        location ~ \.php {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_index index.php;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}