openapi: 3.1.0
info:
  title: Cypht Gateway API
  version: v1
  description: >-
    Stable automation contract over Cypht. Gateway v0.4 adds MCP parity for the mail surface,
    audit visibility, request correlation and safer AI/CLI idempotency behavior.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /meta/version:
    get:
      security: []
      operationId: getVersion
      responses: {"200": {description: Build metadata}}
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LoginRequest"}}}}
      responses: {"200": {description: Authenticated, content: {application/json: {schema: {$ref: "#/components/schemas/LoginResponse"}}}}, "401": {$ref: "#/components/responses/Error"}}
  /auth/logout:
    post:
      operationId: logout
      responses: {"204": {description: Session revoked}, "401": {$ref: "#/components/responses/Error"}}
  /me:
    get:
      operationId: me
      responses: {"200": {description: Current principal}, "401": {$ref: "#/components/responses/Error"}}
  /audit:
    get:
      operationId: listAudit
      parameters:
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200": {description: User-scoped Gateway audit page, content: {application/json: {schema: {$ref: "#/components/schemas/AuditPage"}}}}
        "403": {$ref: "#/components/responses/Error"}
  /tokens:
    get:
      operationId: listTokens
      responses: {"200": {description: PAT metadata list}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: createToken
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateTokenRequest"}}}}
      responses: {"201": {description: Token created}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /tokens/{id}:
    delete:
      operationId: revokeToken
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"204": {description: Revoked}, "404": {$ref: "#/components/responses/Error"}}
  /accounts:
    get:
      operationId: listAccounts
      responses: {"200": {description: Configured mail accounts, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Account"}}}}}, "403": {$ref: "#/components/responses/Error"}}
  /contacts:
    get:
      operationId: listContacts
      x-required-scope: contacts.read
      parameters:
        - {name: query, in: query, schema: {type: string, maxLength: 200}}
      responses:
        "200": {description: Local contacts, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Contact"}}}}}
        "403": {$ref: "#/components/responses/Error"}
        "501": {$ref: "#/components/responses/Error"}
    post:
      operationId: createContact
      x-required-scope: contacts.write
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ContactCreateRequest"}}}}
      responses:
        "201": {description: Contact created, content: {application/json: {schema: {$ref: "#/components/schemas/Contact"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "501": {$ref: "#/components/responses/Error"}
  /contacts/{id}:
    get:
      operationId: readContact
      x-required-scope: contacts.read
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Local contact, content: {application/json: {schema: {$ref: "#/components/schemas/Contact"}}}}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateContact
      x-required-scope: contacts.write
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ContactUpdateRequest"}}}}
      responses:
        "200": {description: Updated contact, content: {application/json: {schema: {$ref: "#/components/schemas/Contact"}}}}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteContact
      x-required-scope: contacts.write
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: confirm, in: query, required: true, schema: {type: boolean, enum: [true]}}
      responses:
        "204": {description: Contact deleted}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /tags:
    get:
      operationId: listTags
      x-required-scope: tags.read
      responses:
        "200": {description: User tags, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Tag"}}}}}
        "403": {$ref: "#/components/responses/Error"}
        "501": {$ref: "#/components/responses/Error"}
    post:
      operationId: createTag
      x-required-scope: tags.write
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TagCreateRequest"}}}}
      responses:
        "201": {description: Tag created, content: {application/json: {schema: {$ref: "#/components/schemas/Tag"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "501": {$ref: "#/components/responses/Error"}
  /tags/{id}:
    patch:
      operationId: updateTag
      x-required-scope: tags.write
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TagUpdateRequest"}}}}
      responses:
        "200": {description: Updated tag, content: {application/json: {schema: {$ref: "#/components/schemas/Tag"}}}}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteTag
      x-required-scope: tags.write
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: confirm, in: query, required: true, schema: {type: boolean, enum: [true]}}
      responses:
        "204": {description: Tag deleted}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /messages/{id}/tags/{tag_id}:
    parameters:
      - {$ref: "#/components/parameters/Id"}
      - {name: tag_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: addMessageTag
      x-required-scope: tags.write
      x-additional-scopes: [mail.read]
      responses:
        "200": {description: Tag added to a message, content: {application/json: {schema: {$ref: "#/components/schemas/ActionResult"}}}}
        "403": {$ref: "#/components/responses/Error"}
    delete:
      operationId: removeMessageTag
      x-required-scope: tags.write
      x-additional-scopes: [mail.read]
      parameters:
        - {name: confirm, in: query, required: true, schema: {type: boolean, enum: [true]}}
      responses:
        "204": {description: Tag removed from a message}
        "400": {$ref: "#/components/responses/Error"}  /feeds:
    get:
      operationId: listFeeds
      x-required-scope: feeds.read
      description: List RSS/Atom feed subscriptions. Feed metadata is read-only in this baseline.
      responses:
        "200": {description: List of feed subscriptions, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/FeedSubscription"}}}}}
        "403": {$ref: "#/components/responses/Error"}
        "501": {$ref: "#/components/responses/Error"}
  /feeds/{id}:
    get:
      operationId: getFeed
      x-required-scope: feeds.read
      description: Read RSS/Atom feed subscription metadata by opaque ID.
      parameters:
        - in: path
          name: id
          required: true
          schema: {$ref: "#/components/schemas/ResourceId"}
      responses:
        "200": {description: Feed subscription metadata, content: {application/json: {schema: {$ref: "#/components/schemas/FeedSubscription"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "501": {$ref: "#/components/responses/Error"}


  /sieve/status:
    get:
      operationId: getSieveStatus
      x-required-scope: sieve.read
      description: Redacted Sieve capability status. This endpoint never returns scripts, credentials, hosts, or raw remote errors.
      responses:
        "200": {description: Redacted per-account Sieve status, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/SieveStatus"}}}}}
        "403": {$ref: "#/components/responses/Error"}
        "501": {$ref: "#/components/responses/Error"}
  /calendars:
    get:
      operationId: listCalendars
      x-required-scope: calendar.read
      description: A synthetic user calendar backed by Cypht 2.12.0 calendar_events.
      responses:
        "200": {description: User calendar, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Calendar"}}}}}
        "403": {$ref: "#/components/responses/Error"}
        "501": {$ref: "#/components/responses/Error"}
  /calendars/{calendar_id}/events:
    get:
      operationId: listCalendarEvents
      x-required-scope: calendar.read
      parameters:
        - {name: calendar_id, in: path, required: true, schema: {$ref: "#/components/schemas/ResourceId"}}
        - {name: start, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: end, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        "200": {description: Calendar event occurrences, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/CalendarEvent"}}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createCalendarEvent
      x-required-scope: calendar.write
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CalendarEventCreateRequest"}}}}
      parameters:
        - {name: calendar_id, in: path, required: true, schema: {$ref: "#/components/schemas/ResourceId"}}
      responses:
        "201": {description: Calendar event created, content: {application/json: {schema: {$ref: "#/components/schemas/CalendarEvent"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "501": {$ref: "#/components/responses/Error"}
  /calendars/{calendar_id}/events/{event_id}:
    delete:
      operationId: deleteCalendarEvent
      x-required-scope: calendar.write
      parameters:
        - {name: calendar_id, in: path, required: true, schema: {$ref: "#/components/schemas/ResourceId"}}
        - {name: event_id, in: path, required: true, schema: {$ref: "#/components/schemas/ResourceId"}}
        - {name: confirm, in: query, required: true, schema: {type: boolean, enum: [true]}}
      responses:
        "204": {description: Calendar event sequence deleted}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "501": {$ref: "#/components/responses/Error"}
  /saved-searches:
    get:
      operationId: listSavedSearches
      x-required-scope: searches.read
      description: User-wide Cypht settings. Account-restricted PATs are denied because a saved query can refer to other accounts.
      responses:
        "200": {description: Saved searches, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/SavedSearch"}}}}}
        "403": {$ref: "#/components/responses/Error"}
        "501": {$ref: "#/components/responses/Error"}
    post:
      operationId: createSavedSearch
      x-required-scope: searches.write
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SavedSearchCreateRequest"}}}}
      responses:
        "201": {description: Saved search created, content: {application/json: {schema: {$ref: "#/components/schemas/SavedSearch"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "501": {$ref: "#/components/responses/Error"}
  /saved-searches/{id}:
    get:
      operationId: readSavedSearch
      x-required-scope: searches.read
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Saved search metadata, content: {application/json: {schema: {$ref: "#/components/schemas/SavedSearch"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateSavedSearch
      x-required-scope: searches.write
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SavedSearchUpdateRequest"}}}}
      responses:
        "200": {description: Updated metadata. A successful rename preserves the opaque ID., content: {application/json: {schema: {$ref: "#/components/schemas/SavedSearch"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteSavedSearch
      x-required-scope: searches.write
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: confirm, in: query, required: true, schema: {type: boolean, enum: [true]}}
      responses:
        "204": {description: Saved search deleted. The ID is retired and will not be reused.}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /profiles:
    get:
      operationId: listProfiles
      responses: {"200": {description: Sending profiles, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Profile"}}}}}, "403": {$ref: "#/components/responses/Error"}}
  /accounts/{id}/mailboxes:
    get:
      operationId: listMailboxes
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Mailboxes, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Mailbox"}}}}}, "403": {$ref: "#/components/responses/Error"}}
  /messages:
    get:
      operationId: listMessages
      parameters:
        - {name: account_id, in: query, schema: {$ref: "#/components/schemas/ResourceId"}}
        - {name: mailbox_id, in: query, schema: {$ref: "#/components/schemas/ResourceId"}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses: {"200": {description: Message page, content: {application/json: {schema: {$ref: "#/components/schemas/MessagePage"}}}}, "403": {$ref: "#/components/responses/Error"}}
  /messages/search:
    post:
      operationId: searchMessages
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SearchRequest"}}}}
      responses: {"200": {description: Search results, content: {application/json: {schema: {$ref: "#/components/schemas/MessagePage"}}}}, "400": {$ref: "#/components/responses/Error"}}
  /messages/send:
    post:
      operationId: sendMessage
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SendMessageRequest"}}}}
      responses: {"200": {description: Sent or scheduled, content: {application/json: {schema: {$ref: "#/components/schemas/MailWriteResult"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /messages/{id}:
    get:
      operationId: readMessage
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Parsed message, content: {application/json: {schema: {$ref: "#/components/schemas/Message"}}}}, "403": {$ref: "#/components/responses/Error"}}
    patch:
      operationId: updateMessage
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MessageUpdateRequest"}}}}
      responses: {"200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/ActionResult"}}}}, "403": {$ref: "#/components/responses/Error"}}
    delete:
      operationId: deleteMessage
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Trashed or deleted, content: {application/json: {schema: {$ref: "#/components/schemas/ActionResult"}}}}, "403": {$ref: "#/components/responses/Error"}}
  /messages/{id}/reply:
    post:
      operationId: replyMessage
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ReplyMessageRequest"}}}}
      responses: {"200": {description: Reply sent or scheduled}, "403": {$ref: "#/components/responses/Error"}}
  /messages/{id}/forward:
    post:
      operationId: forwardMessage
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ForwardMessageRequest"}}}}
      responses: {"200": {description: Forward sent or scheduled}, "403": {$ref: "#/components/responses/Error"}}
  /messages/{id}/move:
    post:
      operationId: moveMessage
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MoveMessageRequest"}}}}
      responses: {"200": {description: Moved}, "403": {$ref: "#/components/responses/Error"}}
  /messages/{id}/archive:
    post:
      operationId: archiveMessage
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Archived}, "403": {$ref: "#/components/responses/Error"}}
  /drafts:
    post:
      operationId: createDraft
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SendMessageRequest"}}}}
      responses: {"201": {description: Draft created}, "403": {$ref: "#/components/responses/Error"}}
  /uploads:
    post:
      operationId: uploadAttachment
      parameters:
        - {name: X-Filename, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 255}}
      requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
      responses: {"201": {description: Temporary upload, content: {application/json: {schema: {$ref: "#/components/schemas/Upload"}}}}, "413": {$ref: "#/components/responses/Error"}}
  /attachments/{id}:
    get:
      operationId: downloadAttachment
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Attachment bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}, "403": {$ref: "#/components/responses/Error"}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    Id: {name: id, in: path, required: true, description: Type-specific opaque resource ID. Previously issued signed v1 mail IDs remain accepted during migration., schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
  responses:
    Error:
      description: Error response
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties: {username: {type: string, minLength: 1}, password: {type: string, format: password, minLength: 1}}
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties: {access_token: {type: string}, token_type: {type: string}, expires_in: {type: integer}}
    ResourceId:
      type: string
      description: Version-2 opaque, owner- and source-bound ID. Existing signed v1 mail IDs remain accepted for migration.
    AccountAllowlistId:
      type: string
      description: New PAT allow-lists require a version-2 account ID returned by GET /accounts. Existing PATs may retain signed v1 account IDs during migration.
    Scope:
      type: string
      enum: [accounts.read, mail.read, mail.search, attachments.read, mail.send, mail.modify, mail.delete, tokens.manage, audit.read, contacts.read, contacts.write, tags.read, tags.write, searches.read, searches.write, calendar.read, calendar.write, feeds.read, feeds.write, sieve.read]
    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        scopes: {type: array, items: {$ref: "#/components/schemas/Scope"}}
        account_allowlist: {type: array, items: {$ref: "#/components/schemas/AccountAllowlistId"}}
        expires_in_days: {type: [integer, "null"], minimum: 1, maximum: 3650}
    Account:
      type: object
      required: [id, name, protocol, can_send]
      properties: {id: {$ref: "#/components/schemas/ResourceId"}, name: {type: string}, email: {type: [string, "null"]}, protocol: {type: string}, server: {type: [string, "null"]}, can_send: {type: boolean}}
    Mailbox:
      type: object
      required: [id, account_id, name, display_name, selectable]
      properties: {id: {$ref: "#/components/schemas/ResourceId"}, account_id: {$ref: "#/components/schemas/ResourceId"}, name: {type: string}, display_name: {type: string}, role: {type: [string, "null"]}, total: {type: [integer, "null"]}, unread: {type: [integer, "null"]}, selectable: {type: boolean}}
    Profile:
      type: object
      required: [id, name, address, reply_to, signature, is_default]
      properties: {id: {type: string}, name: {type: string}, address: {type: string}, reply_to: {type: string}, signature: {type: string}, account_id: {anyOf: [{$ref: "#/components/schemas/ResourceId"}, {type: "null"}]}, is_default: {type: boolean}}
    Address:
      type: object
      required: [email]
      properties: {name: {type: [string, "null"]}, email: {type: string}}
    MessageBody:
      type: object
      properties: {text: {type: [string, "null"]}, html: {type: [string, "null"]}}
    MessageSummary:
      type: object
      additionalProperties: true
      required: [id, account_id, mailbox_id, subject, from, to, date, timestamp, unread, flagged, has_attachments, preview]
      properties:
        id: {$ref: "#/components/schemas/ResourceId"}
        account_id: {$ref: "#/components/schemas/ResourceId"}
        mailbox_id: {$ref: "#/components/schemas/ResourceId"}
        subject: {type: string}
        from: {type: array, items: {$ref: "#/components/schemas/Address"}}
        to: {type: array, items: {$ref: "#/components/schemas/Address"}}
        date: {type: [string, "null"]}
        timestamp: {type: [integer, "null"]}
        unread: {type: boolean}
        flagged: {type: boolean}
        has_attachments: {type: boolean}
        preview: {type: [string, "null"]}
    Message:
      type: object
      required: [id, account_id, mailbox_id, subject, from, to, cc, date, message_id_header, in_reply_to, body, attachments, headers]
      properties:
        id: {$ref: "#/components/schemas/ResourceId"}
        account_id: {$ref: "#/components/schemas/ResourceId"}
        mailbox_id: {$ref: "#/components/schemas/ResourceId"}
        subject: {type: string}
        from: {type: array, items: {$ref: "#/components/schemas/Address"}}
        to: {type: array, items: {$ref: "#/components/schemas/Address"}}
        cc: {type: array, items: {$ref: "#/components/schemas/Address"}}
        date: {type: [string, "null"]}
        message_id_header: {type: [string, "null"]}
        in_reply_to: {type: [string, "null"]}
        body: {$ref: "#/components/schemas/MessageBody"}
        attachments: {type: array, items: {$ref: "#/components/schemas/Attachment"}}
        headers: {type: object}
    Attachment:
      type: object
      required: [id, inline]
      properties: {id: {$ref: "#/components/schemas/ResourceId"}, filename: {type: [string, "null"]}, content_type: {type: [string, "null"]}, size: {type: [integer, "null"]}, inline: {type: boolean}}
    MessagePage:
      type: object
      required: [messages]
      properties: {messages: {type: array, items: {$ref: "#/components/schemas/MessageSummary"}}, total: {type: [integer, "null"]}, next_offset: {type: [integer, "null"]}}
    SearchRequest:
      type: object
      required: [query]
      properties: {account_ids: {type: array, items: {$ref: "#/components/schemas/ResourceId"}}, mailbox_id: {anyOf: [{$ref: "#/components/schemas/ResourceId"}, {type: "null"}]}, query: {type: string}, limit: {type: [integer, "null"], minimum: 1, maximum: 100}}
    SendMessageRequest:
      type: object
      properties:
        profile_id: {type: [string, "null"]}
        to: {type: array, items: {$ref: "#/components/schemas/Address"}}
        cc: {type: array, items: {$ref: "#/components/schemas/Address"}}
        bcc: {type: array, items: {$ref: "#/components/schemas/Address"}}
        subject: {type: string}
        body: {$ref: "#/components/schemas/MessageBody"}
