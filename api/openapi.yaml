        starts_at: {type: string, format: date-time}
        repeat_interval: {type: string, enum: [none, day, week, month, year]}
    SavedSearch:
      type: object
      additionalProperties: false
      required: [id, name, type]
      properties:
        id: {$ref: "#/components/schemas/ResourceId"}
        name: {type: string, minLength: 1, maxLength: 100}
        type: {type: string, enum: [simple, advanced]}
        query: {type: [string, "null"], maxLength: 1000}
        since: {type: [string, "null"], maxLength: 100}
        field: {type: [string, "null"], enum: [TEXT, BODY, FROM, SUBJECT, TO, CC, null]}
        advanced: {anyOf: [{$ref: "#/components/schemas/AdvancedSavedSearchData"}, {type: "null"}]}
    SavedSearchCreateRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [name, type, query]
          properties:
            name: {type: string, minLength: 1, maxLength: 100}
            type: {type: string, const: simple}
            query: {type: string, minLength: 1, maxLength: 1000}
            since: {type: string, enum: [today, "-1 week", "-2 weeks", "-4 weeks", "-6 weeks", "-6 months", "-1 year", "-5 years"]}
            field: {type: string, enum: [TEXT, BODY, FROM, SUBJECT, TO, CC]}
        - type: object
          additionalProperties: false
          required: [name, type, advanced]
          properties:
            name: {type: string, minLength: 1, maxLength: 100}
            type: {type: string, const: advanced}
            advanced: {$ref: "#/components/schemas/AdvancedSavedSearchData"}
    SavedSearchUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        query: {type: string, minLength: 1, maxLength: 1000}
        since: {type: string, enum: [today, "-1 week", "-2 weeks", "-4 weeks", "-6 weeks", "-6 months", "-1 year", "-5 years"]}
        field: {type: string, enum: [TEXT, BODY, FROM, SUBJECT, TO, CC]}
        advanced: {$ref: "#/components/schemas/AdvancedSavedSearchData"}
    AdvancedSavedSearchData:
      type: object
      additionalProperties: false
      required: [terms, targets, sources, times, other]
      properties:
        terms:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [term]
            properties:
              term: {type: string, minLength: 1, maxLength: 500}
              condition: {oneOf: [{type: boolean}, {type: string, enum: [and, or]}, {type: "null"}]}
        targets:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [target, orig]
            properties:
              target: {type: string, maxLength: 78}
              orig: {type: string, enum: [TEXT, BODY, header, custom]}
              condition: {oneOf: [{type: boolean}, {type: string, enum: [and, or]}, {type: "null"}]}
        sources:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [account_id]
            properties:
              account_id: {$ref: "#/components/schemas/ResourceId"}
              mailbox_id: {anyOf: [{$ref: "#/components/schemas/ResourceId"}, {type: "null"}]}
              all_folders: {type: boolean, default: false}
              subfolders: {type: boolean, default: false}
        times:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [from, to]
            properties:
              from: {type: string, format: date}
              to: {type: string, format: date}
        other:
          type: object
          additionalProperties: false
          required: [limit]
          properties:
            limit: {type: integer, minimum: 1, maximum: 1000}
            flags: {type: array, maxItems: 8, items: {type: string, enum: [SEEN, UNSEEN, ANSWERED, UNANSWERED, FLAGGED, UNFLAGGED, DELETED, UNDELETED]}}
            charset: {type: [string, "null"], enum: [UTF-8, ASCII, null]}
    Upload:
      type: object
      required: [id, filename, content_type, size]
      properties: {id: {type: string, description: Session-bound upload ID}, filename: {type: string}, content_type: {type: string}, size: {type: integer}}
    MailWriteResult:
      type: object
      required: [status, scheduled]
      properties: {status: {type: string}, message_id_header: {type: [string, "null"]}, message_id: {anyOf: [{$ref: "#/components/schemas/ResourceId"}, {type: "null"}]}, scheduled: {type: boolean}}
    ActionResult:
      type: object
      required: [status]
      properties: {status: {type: string}, mailbox_id: {anyOf: [{$ref: "#/components/schemas/ResourceId"}, {type: "null"}]}, tag_sync: {type: [string, "null"], enum: [synced, pending, none, disabled, failed, null]}}
    AuditEntry:
      type: object
      required: [id, created_at, username, operation, success]
      properties:
        id: {type: integer}
        created_at: {type: integer}
        username: {type: string}
        auth_id: {type: [string, "null"]}
        operation: {type: string}
        resource: {type: [string, "null"]}
        success: {type: boolean}
        detail: {type: [string, "null"]}
    AuditPage:
      type: object
      required: [entries]
      properties:
        entries: {type: array, items: {$ref: "#/components/schemas/AuditEntry"}}
        next_offset: {type: [integer, "null"]}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: {code: {type: string}, message: {type: string}, request_id: {type: [string, "null"]}}
