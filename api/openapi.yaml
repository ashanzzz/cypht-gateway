openapi: 3.1.0
info:
  title: Cypht Gateway API
  version: v1
  description: >-
    Stable automation contract over Cypht. Gateway v0.3 adds sending, drafts,
    scheduled sending, reply/forward, attachment transfer and message mutations.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /meta/version:
    get:
      security: []
      operationId: getVersion
      responses: {"200": {description: Build metadata}}
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LoginRequest"}}}}
      responses: {"200": {description: Authenticated, content: {application/json: {schema: {$ref: "#/components/schemas/LoginResponse"}}}}, "401": {$ref: "#/components/responses/Error"}}
  /auth/logout:
    post:
      operationId: logout
      responses: {"204": {description: Session revoked}, "401": {$ref: "#/components/responses/Error"}}
  /me:
    get:
      operationId: me
      responses: {"200": {description: Current principal}, "401": {$ref: "#/components/responses/Error"}}
  /tokens:
    get:
      operationId: listTokens
      responses: {"200": {description: PAT metadata list}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: createToken
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateTokenRequest"}}}}
      responses: {"201": {description: Token created}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /tokens/{id}:
    delete:
      operationId: revokeToken
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"204": {description: Revoked}, "404": {$ref: "#/components/responses/Error"}}
  /accounts:
    get:
      operationId: listAccounts
      responses: {"200": {description: Configured mail accounts, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Account"}}}}}, "403": {$ref: "#/components/responses/Error"}}
  /profiles:
    get:
      operationId: listProfiles
      responses: {"200": {description: Sending profiles, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Profile"}}}}}, "403": {$ref: "#/components/responses/Error"}}
  /accounts/{id}/mailboxes:
    get:
      operationId: listMailboxes
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Mailboxes}, "403": {$ref: "#/components/responses/Error"}}
  /messages:
    get:
      operationId: listMessages
      parameters:
        - {name: account_id, in: query, schema: {type: string}}
        - {name: mailbox_id, in: query, schema: {type: string}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses: {"200": {description: Message page, content: {application/json: {schema: {$ref: "#/components/schemas/MessagePage"}}}}, "403": {$ref: "#/components/responses/Error"}}
  /messages/search:
    post:
      operationId: searchMessages
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SearchRequest"}}}}
      responses: {"200": {description: Search results}, "400": {$ref: "#/components/responses/Error"}}
  /messages/send:
    post:
      operationId: sendMessage
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SendMessageRequest"}}}}
      responses: {"200": {description: Sent or scheduled, content: {application/json: {schema: {$ref: "#/components/schemas/MailWriteResult"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /messages/{id}:
    get:
      operationId: readMessage
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Parsed message}, "403": {$ref: "#/components/responses/Error"}}
    patch:
      operationId: updateMessage
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MessageUpdateRequest"}}}}
      responses: {"200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/ActionResult"}}}}, "403": {$ref: "#/components/responses/Error"}}
    delete:
      operationId: deleteMessage
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Trashed or deleted, content: {application/json: {schema: {$ref: "#/components/schemas/ActionResult"}}}}, "403": {$ref: "#/components/responses/Error"}}
  /messages/{id}/reply:
    post:
      operationId: replyMessage
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ReplyMessageRequest"}}}}
      responses: {"200": {description: Reply sent or scheduled}, "403": {$ref: "#/components/responses/Error"}}
  /messages/{id}/forward:
    post:
      operationId: forwardMessage
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ForwardMessageRequest"}}}}
      responses: {"200": {description: Forward sent or scheduled}, "403": {$ref: "#/components/responses/Error"}}
  /messages/{id}/move:
    post:
      operationId: moveMessage
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MoveMessageRequest"}}}}
      responses: {"200": {description: Moved}, "403": {$ref: "#/components/responses/Error"}}
  /messages/{id}/archive:
    post:
      operationId: archiveMessage
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Archived}, "403": {$ref: "#/components/responses/Error"}}
  /drafts:
    post:
      operationId: createDraft
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SendMessageRequest"}}}}
      responses: {"201": {description: Draft created}, "403": {$ref: "#/components/responses/Error"}}
  /uploads:
    post:
      operationId: uploadAttachment
      parameters:
        - {name: X-Filename, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 255}}
      requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
      responses: {"201": {description: Temporary upload, content: {application/json: {schema: {$ref: "#/components/schemas/Upload"}}}}, "413": {$ref: "#/components/responses/Error"}}
  /attachments/{id}:
    get:
      operationId: downloadAttachment
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Attachment bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}, "403": {$ref: "#/components/responses/Error"}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
  responses:
    Error:
      description: Error response
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties: {username: {type: string, minLength: 1}, password: {type: string, format: password, minLength: 1}}
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties: {access_token: {type: string}, token_type: {type: string}, expires_in: {type: integer}}
    Scope:
      type: string
      enum: [accounts.read, mail.read, mail.search, attachments.read, mail.send, mail.modify, mail.delete, tokens.manage]
    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        scopes: {type: array, items: {$ref: "#/components/schemas/Scope"}}
        account_allowlist: {type: array, items: {type: string}}
        expires_in_days: {type: [integer, "null"], minimum: 1, maximum: 3650}
    Account:
      type: object
      required: [id, name, protocol, can_send]
      properties: {id: {type: string}, name: {type: string}, email: {type: [string, "null"]}, protocol: {type: string}, server: {type: [string, "null"]}, can_send: {type: boolean}}
    Profile:
      type: object
      required: [id, name, address, reply_to, signature, is_default]
      properties: {id: {type: string}, name: {type: string}, address: {type: string}, reply_to: {type: string}, signature: {type: string}, account_id: {type: [string, "null"]}, is_default: {type: boolean}}
    Address:
      type: object
      required: [email]
      properties: {name: {type: [string, "null"]}, email: {type: string}}
    MessageBody:
      type: object
      properties: {text: {type: [string, "null"]}, html: {type: [string, "null"]}}
    MessageSummary:
      type: object
      additionalProperties: true
    MessagePage:
      type: object
      required: [messages]
      properties: {messages: {type: array, items: {$ref: "#/components/schemas/MessageSummary"}}, total: {type: [integer, "null"]}, next_offset: {type: [integer, "null"]}}
    SearchRequest:
      type: object
      required: [query]
      properties: {account_ids: {type: array, items: {type: string}}, mailbox_id: {type: [string, "null"]}, query: {type: string}, limit: {type: [integer, "null"], minimum: 1, maximum: 100}}
    SendMessageRequest:
      type: object
      properties:
        profile_id: {type: [string, "null"]}
        to: {type: array, items: {$ref: "#/components/schemas/Address"}}
        cc: {type: array, items: {$ref: "#/components/schemas/Address"}}
        bcc: {type: array, items: {$ref: "#/components/schemas/Address"}}
        subject: {type: string}
        body: {$ref: "#/components/schemas/MessageBody"}
        attachment_ids: {type: array, items: {type: string}}
        schedule_at: {type: [string, "null"], description: Future ISO-8601 date/time}
        delivery_receipt: {type: boolean}
    ReplyMessageRequest:
      type: object
      properties: {profile_id: {type: [string, "null"]}, reply_all: {type: boolean}, body: {$ref: "#/components/schemas/MessageBody"}, attachment_ids: {type: array, items: {type: string}}, schedule_at: {type: [string, "null"]}}
    ForwardMessageRequest:
      allOf:
        - {$ref: "#/components/schemas/SendMessageRequest"}
      description: Subject is derived from the original message; delivery_receipt is ignored.
    MessageUpdateRequest:
      type: object
      properties: {seen: {type: [boolean, "null"]}, flagged: {type: [boolean, "null"]}}
    MoveMessageRequest:
      type: object
      required: [mailbox_id]
      properties: {mailbox_id: {type: string}}
    Upload:
      type: object
      required: [id, filename, content_type, size]
      properties: {id: {type: string}, filename: {type: string}, content_type: {type: string}, size: {type: integer}}
    MailWriteResult:
      type: object
      required: [status, scheduled]
      properties: {status: {type: string}, message_id_header: {type: [string, "null"]}, message_id: {type: [string, "null"]}, scheduled: {type: boolean}}
    ActionResult:
      type: object
      required: [status]
      properties: {status: {type: string}, mailbox_id: {type: [string, "null"]}}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: {code: {type: string}, message: {type: string}, request_id: {type: [string, "null"]}}
