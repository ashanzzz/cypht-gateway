name: Container Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 scripts/check-version.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  cypht-with-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-cypht
          tags: |
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cypht
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  cypht-aio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-aio
          tags: |
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.aio
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cypht-aio
          cache-to: type=gha,scope=cypht-aio,mode=max

  promote:
    needs: [gateway, cypht-with-bridge, cypht-aio]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote mutable tags
        shell: bash
        run: |
          SHA_TAG="sha-${GITHUB_SHA}"
          REPOS=(
            "ghcr.io/${GITHUB_REPOSITORY}"
            "ghcr.io/${GITHUB_REPOSITORY}-cypht"
            "ghcr.io/${GITHUB_REPOSITORY}-aio"
          )
          
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            for repo in "${REPOS[@]}"; do
              echo "Promoting edge tag for ${repo}"
              docker buildx imagetools create --tag "${repo}:edge" "${repo}:${SHA_TAG}"
            done
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            for repo in "${REPOS[@]}"; do
              echo "Promoting release tag for ${repo}: ${TAG_NAME}"
              docker buildx imagetools create --tag "${repo}:${TAG_NAME}" "${repo}:${SHA_TAG}"
              if [[ "${TAG_NAME}" != *-* ]]; then
                echo "Promoting latest tag for ${repo}"
                docker buildx imagetools create --tag "${repo}:latest" "${repo}:${SHA_TAG}"
              fi
            done
          fi
