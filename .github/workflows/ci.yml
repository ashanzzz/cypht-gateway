name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, mbstring, sqlite3, sodium
      - name: Check version consistency
        run: python3 scripts/check-version.py
      - name: Check repository invariants
        run: python3 scripts/check-repository.py
      - name: Check frontend JavaScript
        run: python3 scripts/check-frontend.py
      - name: PHP bridge syntax
        run: find cypht-module -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Cypht 2.12.0 Bridge and repository tests
        run: |
          php tests/bridge_contract.php
          php tests/bridge_persistence_guard.php
          curl --fail --location --retry 3 https://codeload.github.com/cypht-org/cypht/zip/refs/tags/v2.12.0 -o /tmp/cypht-v2.12.0.zip
          echo "44cf3a67438ed1d0921dbc1cab58a6939b1a09667156984ca193dbce57a24605  /tmp/cypht-v2.12.0.zip" | sha256sum -c -
          unzip -q /tmp/cypht-v2.12.0.zip -d /tmp
          CYPHT_SOURCE_PATH=/tmp/cypht-2.12.0 python3 scripts/check-cypht-matrix.py
          CYPHT_SOURCE_PATH=/tmp/cypht-2.12.0 php tests/cypht_contacts_repo.php
          CYPHT_SOURCE_PATH=/tmp/cypht-2.12.0 php tests/bridge_ping.php
          CYPHT_SOURCE_PATH=/tmp/cypht-2.12.0 php tests/cypht_api_login_config.php
          CYPHT_SOURCE_PATH=/tmp/cypht-2.12.0 php tests/cypht_tags_repo.php
          CYPHT_SOURCE_PATH=/tmp/cypht-2.12.0 php tests/bridge_tags.php
          CYPHT_SOURCE_PATH=/tmp/cypht-2.12.0 php tests/cypht_saved_searches_repo.php
          CYPHT_SOURCE_PATH=/tmp/cypht-2.12.0 php tests/bridge_saved_searches.php
          CYPHT_SOURCE_PATH=/tmp/cypht-2.12.0 php tests/bridge_calendar.php
          CYPHT_SOURCE_PATH=/tmp/cypht-2.12.0 php tests/bridge_sieve_status.php
          CYPHT_SOURCE_PATH=/tmp/cypht-2.12.0 php tests/cypht_user_config_persistence.php
      - name: Reject missing or shared Cypht Bridge keys
        run: |
          sh -n docker/cypht-gateway-entrypoint.sh
          if env -u API_LOGIN_KEY GATEWAY_BRIDGE_KEY=ci-test sh docker/cypht-gateway-entrypoint.sh >/dev/null 2>&1; then exit 1; fi
          if API_LOGIN_KEY=ci-test GATEWAY_BRIDGE_KEY=ci-test sh docker/cypht-gateway-entrypoint.sh >/dev/null 2>&1; then exit 1; fi
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release binaries
        run: cargo build --release --workspace

  container-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose profiles
        run: |
          set -eu
          export GATEWAY_MASTER_KEY="$(openssl rand -base64 32)"
          export CYPHT_API_LOGIN_KEY="ci-only-api-login"
          export CYPHT_BRIDGE_KEY="ci-only-bridge"
          export CYPHT_BASE_URL="http://cypht:80/"
          docker compose --env-file deploy/local-dev.env.example --profile edge -f deploy/docker-compose.yml config --quiet
          docker compose --env-file deploy/unraid.env.example --profile edge -f deploy/docker-compose.yml config --quiet
      - name: Validate edge proxy configuration
        run: |
          docker run --rm \
            -e CYPHT_PROXY_UPSTREAM=http://cypht:80 \
            -v "$PWD/deploy/nginx/gateway-edge.conf:/etc/nginx/templates/default.conf.template:ro" \
            nginx:stable-alpine nginx -t
      - name: Build Gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: local/cypht-gateway:ci
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
      - name: Build Cypht 2.12.0 Bridge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cypht
          build-args: CYPHT_IMAGE=cypht/cypht:2.12.0
          platforms: linux/amd64
          push: false
          tags: local/cypht-bridge:ci
          cache-from: type=gha,scope=cypht-bridge
          cache-to: type=gha,scope=cypht-bridge,mode=max
      - name: Build All-in-One image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.aio
          build-args: CYPHT_IMAGE=cypht/cypht:2.12.0
          platforms: linux/amd64
          push: false
          tags: local/cypht-aio:ci
          cache-from: type=gha,scope=cypht-aio
          cache-to: type=gha,scope=cypht-aio,mode=max
