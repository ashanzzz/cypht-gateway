name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check version consistency
        run: python3 scripts/check-version.py
      - name: Check repository invariants
        run: python3 scripts/check-repository.py
      - name: Check frontend JavaScript
        run: python3 scripts/check-frontend.py
      - name: PHP bridge syntax
        run: find cypht-module -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Normalize Rust formatting for verification
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release binaries
        run: cargo build --release --workspace
