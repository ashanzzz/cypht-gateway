# Gateway edge template. Cypht keeps its separate native UI address.
# gateway and mcp resolve on the private Docker network.
server {
    listen 8088;
    server_name _;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $gateway_backend gateway:8080;
    set $mcp_backend mcp:8790;

    # Keep the private PHP bridge and API-login exchange off the public origin.
    if ($arg_page ~ "^(ajax_gateway_.*|process_api_login)$") {
        return 404;
    }

    location = /healthz {
        proxy_pass http://$gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1 {
        proxy_pass http://$gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/v1/ {
        proxy_pass http://$gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /mcp {
        proxy_pass http://$mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://$gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
